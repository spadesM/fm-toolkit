[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-toolkit"
version = "1.0.0"
description = "Football Manager Save Parser, Reverse-Engineering Toolkit, Engine Formula Analyzer & Multi-Format Exporter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FM Toolkit Contributors"}
]
dependencies = [
    "zstandard>=0.22.0",
    "backports-zstd>=1.0.0; python_version < '3.14'",
]

[project.optional-dependencies]
# UI bundle patches (fm26save.ui_patches / fm26save.unity_bundle) and IL2CPP disassembly research
ui-patches = ["lz4>=4.0"]
research = ["lz4>=4.0", "capstone>=5.0"]

[project.scripts]
fm-toolkit = "fm26save.cli:main"
fm26save = "fm26save.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fm26save*"]
